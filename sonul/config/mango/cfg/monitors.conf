# | Outputs Configuration |
# Configure your monitors here or in the DMS "Displays" settings. | https://mangowm.github.io/docs/configuration/monitors
# Run `wlr-randr` to get your monitors information.
# You will have to remove "#" and edit it for it to take effect.

# monitor_rule = name:DP-1, width:2560, height:1440, refresh:179.999, x:0, y:0, rr:0, vrr:1

# x/y are in logical (scaled) pixels: 1920 / 1.25 = 1536
monitor_rule = name:HDMI-A-1, width:1920, height:1080, refresh:75, x:0, y:0, scale:1.25
monitor_rule = name:eDP-1, width:1920, height:1200, refresh:60, x:1536, y:0, scale:1.25
