# Umbriel configuration
#
# This file only wires together the files in ./config/, the same way
# ~/.config/hypr/hyprland.lua pulls in ~/.config/hypr/config/*.lua. Each file
# there covers one topic and lists every option the installed Umbriel accepts:
# active settings are uncommented, the rest are commented out with their
# built-in default (or marked "example" where there is no fixed default).
#
# Most changes apply when a file is saved. Check edits with
# `umbriel config validate`, and list every accepted key with
# `umbriel config schema --json`.
#
# Complete reference: https://docs.noctalia.dev/umbriel/

# ==============================================================================
# Includes
#
# Included files are applied in list order, and this file is applied last:
# - Tables merge by key, so one table can be spread across files.
# - Rule lists ([[window_rule]], [[layer_rule]], [[workspace]],
#   [[input.device]], [[security_context_rule]]) collect entries in file order.
# - Plain arrays and scalar values are replaced by the last file that sets them.
# Paths are relative to this file; ~, $VAR and ${VAR} are expanded.
# https://docs.noctalia.dev/umbriel/configuration/#include
# ==============================================================================

[include]
files = [
  "config/autostart.toml",     # [general] autostart
  "config/general.toml",       # [general], [screencast]
  "config/environment.toml",   # [environment]
  "config/monitors.toml",      # [output.*], [events] lid actions
  "config/inputs.toml",        # [input.*], [[input.device]]
  "config/colors.toml",        # [colors.*]
  "config/decorations.toml",   # [appearance.*] borders, blur, shadow
  "config/animations.toml",    # [animation.*]
  "config/effects.toml",       # [effects.*] shader presets and pools
  "config/layout.toml",        # [layout.*]
  "config/workspaces.toml",    # [workspaces], [[workspace]]
  "config/overview.toml",      # [overview], [hot_corners.*]
  "config/scratchpads.toml",   # [[scratchpad]]
  "config/windowrules.toml",   # [[window_rule]]
  "config/layerrules.toml",    # [[layer_rule]]
  "config/security.toml",      # [[security_context_rule]]
  "config/binds.toml",         # [keybinds]
]

# Missing optional files are ignored and watched, so creating one later
# reloads the configuration.
[include.optional]
files = []

# ==============================================================================
# DRM devices
#
# Leave a GPU unopened in a native session. Omit for automatic GPU discovery.
# This stays in the main file: if any included file defines [drm], Umbriel
# requires it to be declared here too. Changes require a restart.
# https://docs.noctalia.dev/umbriel/configuration/#drm-devices
# ==============================================================================

# [drm]
# ignored_pci_addresses = ["0000:01:00.0"]
# ignored_devices = ["/dev/dri/by-path/pci-0000:01:00.0-card"]
