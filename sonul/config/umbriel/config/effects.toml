# ==============================================================================
# Effects
#
# GLSL programs for animation events, the focused window's border, every
# window, whole outputs, and around the pointer.
# https://docs.noctalia.dev/umbriel/effects/
#
# The custom presets below live in ./effects/*.glsl and use the theme palette
# (accent_primary, accent_secondary, warning, error). Noctalia writes that
# palette to ../noctalia.toml from your wallpaper, so the effects recolor
# whenever the theme changes.
#
# Bundled presets, in /usr/share/umbriel/effects/<kind>/<name>/effect.toml:
#   reveal     animation   [animation.windows_in] or windows_out: effect = "reveal"
#   squash     animation   [animation.windows_move]: effect = "squash"
#   pulse      border      [effects] border = "pulse"
#   scanlines  window      [effects] window = "scanlines"
#   vignette   screen      [effects] screen = "vignette"
#   glow       cursor      [effects] cursor = "glow"
#
# Including a preset only makes it available; a selector turns it on.
# Relative paths below resolve from this file. squash is already included by
# animations.toml; including a preset in two files is an error.
# ==============================================================================

# [include]
# files = ["/usr/share/umbriel/effects/border/pulse/effect.toml"]

# "" selects nothing. Runtime toggles: `umbriel msg effect-border-toggle`,
# effect-window-toggle, effect-screen-toggle, effect-cursor-toggle.
[effects]
border = "aurora"                    # default ""; border preset or pool for the focused window
window = "glass"                     # default ""; window preset or pool for every window
screen = "dusk"                      # default ""; screen preset or pool for every output
cursor = ""                          # default ""; cursor preset or pool, shared across outputs ("halo" for the glow)
# max_fps = 0                        # 0 to 240 cap on frames drawn only for effects; 0 follows refresh
# in_capture = false                 # include window, screen and cursor effects in screenshots

# ------------------------------------------------------------------------------
# Presets
# ------------------------------------------------------------------------------

# Aurora: the focused window's ring becomes a slowly turning gradient through
# the theme palette, with a glint gliding around it, a soft halo, and light
# spilling onto whatever sits next to the window.
[effects.preset.aurora]
kind = "border"
shader = "effects/aurora.glsl"
palette = true
padding = 18                         # room outside the ring for the halo, 0 to 1024
speed = 1.0                          # multiplier on the shader clock, 0 to 10
animated = true

[effects.preset.aurora.light]
spread = 36                          # how far the light spills, 1 to 256 logical px
intensity = 0.7                      # 0 to 4
threshold = 0.5                      # ring brightness needed to emit, 0 to 1

# Glass: a faint sheen across the top of every window and a thin rim of light
# along its upper edge, to match the translucent, blurred windows.
[effects.preset.glass]
kind = "window"
shader = "effects/glass.glsl"

# Dusk: a gentle vignette that softly darkens the far corners of each screen.
[effects.preset.dusk]
kind = "screen"
shader = "effects/dusk.glsl"

# Halo: a small soft glow around the pointer in the theme accent.
[effects.preset.halo]
kind = "cursor"
shader = "effects/halo.glsl"
palette = true
radius = 48                          # half-size of the square around the pointer, 0 to 4096

# Bloom: windows rise into place out of a soft accent glow and sink back into
# it when they close. Selected in animations.toml (windows_in, windows_out).
[effects.preset.bloom]
kind = "animation"
shader = "effects/bloom.glsl"
palette = true

# Pools pick a stable preset for each window or output. Select a pool like a
# preset, e.g. border = "borders". This example needs pulse included above.
# [effects.pool.borders]
# kind = "border"                    # border, window, screen, cursor
# choose = ["aurora", "pulse"]
# selection = "unused_first"         # unused_first, round_robin, random

# ------------------------------------------------------------------------------
# Where effects stay off
# ------------------------------------------------------------------------------

# Scratchpad windows keep their own border colors.
[[window_rule]]
match.is_scratchpad = true
border_effect = "off"

# No glass over video and games.
[[window_rule]]
match.content_type = "video"
window_effect = "off"

[[window_rule]]
match.content_type = "game"
window_effect = "off"

[[window_rule]]
match.app_id = "^(mpv|vlc|gamescope|steam_app_[0-9]+)$"
window_effect = "off"

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
window_effect = "off"

# Runtime selection binds go in binds.toml, for example:
# "Mod+Shift+E" = "effect-border-toggle"
# "Mod+Ctrl+E" = "effect-window-toggle"
# "Mod+Alt+E" = "effect-border-cycle:borders"
